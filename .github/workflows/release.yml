# .github/workflows/release.yml — انتشار خودکار نسخه‌ی ویندوزی KodYar.
#
# با پوش‌شدن هر تگ `v*` (مثل `v1.0.0`) این workflow باینری ویندوز را
# می‌سازد و به همان Release در GitHub پیوست می‌کند. نسخه از خود تگ خوانده
# می‌شود (`v1.0.0` → `1.0.0`) تا باینری هرگز نسخه‌ی دیگری گزارش نکند.
#
# همان روش CI اصلی: کامپایل متقاطع ویندوز روی ubuntu (خالص Go، بدون MinGW)
# با `-skipbindings` چون frontend/wailsjs دستی و در مخزن نگه‌داری می‌شود.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build KodYar.exe and publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go (from go.mod)
        uses: actions/setup-go@v6.2.0
        with:
          go-version: "1.26.11"
          cache: true

      - name: Install Wails CLI (pinned to go.mod version)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Sanity check (tests must pass before publishing)
        run: go test -count=1 ./...

      # همان اسکریپت محلی: resource نسخه (Properties ویندوز) + بیلد wails.
      - name: Build package (windows/amd64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "building KodYar ${VERSION}"
          bash build.sh "$VERSION"

      # تا وقتی exe مانیفست رندرشده و FileVersion همان تگ را ندارد، منتشر نشود.
      - name: Verify executable manifest and FileVersion
        env:
          KODYAR_EXE: build/bin/KodYar.exe
        run: |
          KODYAR_EXPECTED_VERSION="${GITHUB_REF_NAME#v}"             go test -count=1 -run TestWindowsExecutableManifestAndVersion .

      # چکسام کنار باینری منتشر می‌شود تا کاربر بتواند دانلود را بررسی کند.
      - name: Generate SHA256SUMS
        run: |
          cd build/bin
          sha256sum KodYar.exe > SHA256SUMS
          cat SHA256SUMS

      # توضیح انتشار از همان بخش نسخه در CHANGELOG.md استخراج می‌شود تا
      # فهرست تغییرها یک منبع داشته باشد و دستی تکرار نشود.
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## ${VERSION}" '
            index($0, v) == 1 { inside = 1 }
            inside && /^## / && index($0, v) != 1 { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## ${VERSION}' section"
            exit 1
          fi

      - name: Publish release with the Windows executable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # تگ ممکن است از قبل ریلیز داشته باشد (بازانتشار همان نسخه با
          # اصلاحات): آن‌گاه فقط باینری تازه جایگزین می‌شود، وگرنه ریلیز
          # جدید با notes تولیدشده ساخته می‌شود.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              build/bin/KodYar.exe build/bin/SHA256SUMS --clobber
          elif [ -s release-notes.md ]; then
            # همان بخش نسخه از CHANGELOG.md که مرحلهٔ بالا ساخت.
            gh release create "$GITHUB_REF_NAME" \
              build/bin/KodYar.exe build/bin/SHA256SUMS \
              --title "KodYar ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              build/bin/KodYar.exe build/bin/SHA256SUMS \
              --title "KodYar ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --verify-tag
          fi
