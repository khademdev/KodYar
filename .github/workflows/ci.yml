# .github/workflows/ci.yml — CI برای KodYar.
#
# NOTE: این workflow روی GitHub Actions اجرا می‌شود (نسخهٔ 1.0.2 و تگ v1.0.2
# واقعاً اجرا و سبز شدند)؛ تست‌های محلی ویندوز هم همان مسیر را پوشش می‌دهند.
#
#   - windows (اصلی): gofmt + vet + test -race — محصول روی ویندوز است.
#   - linux (ثانویه): پکیج‌های GTK/WebKit که وایلز برای کامپایل لازم دارد؛
#     اوبونتو ۲۴.۰۴ فقط webkit2gtk-4.1 دارد، پس تگ webkit2_41 لازم است.
#   - windows-build (اختیاری): بیلد واقعی با Wails CLI پین‌شده به go.mod.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- ویندوز (اصلی)
  windows:
    name: Test (windows-latest, race)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: gofmt check (must be clean)
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # پیش‌نیاز محیطی: توکن AppContainer به \Device\Null دسترسی ندارد و
      # go/git داخل سندباکس می‌میرند. رانر ویندوزی Administrator است، پس همان
      # اسکریپت مستند را اجباری اجرا می‌کنیم: اگر مجوز ثبت نشود job قرمز
      # می‌شود — وعدهٔ امنیتی نباید بی‌صدا skip شود.
      - name: Grant NUL device to the sandbox SID (required)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\grant-sandbox-nul.ps1

      # شکست تست‌ها به شکل annotation منتشر می‌شود تا نام تستِ قرمز و
      # فایل/خطای آن، علاوه بر لاگ (که فقط با دسترسی مدیر خواندنی است)،
      # از API/صفحه‌ی Actions هم دیده شود. کد خروج همان کد go test است.
      - name: go test (race)
        shell: bash
        env:
          # مجوز NUL در مرحلهٔ بالا اجباری شد؛ پس نبودش در تست‌های سندباکس
          # شکست است، نه skip.
          KODYAR_EXPECT_NUL_GRANTED: "1"
        run: |
          set -o pipefail
          # مهلت طولانی‌تر: اولین تست سندباکس روی رانر سرد، مجوزهای ACL مسیرهای
          # ابزار را با icacls می‌گیرد؛ این آماده‌سازی می‌تواند چند دقیقه طول بکشد.
          if go test -race -count=1 -timeout 20m ./... 2>&1 | tee go-test.log; then
            exit 0
          fi
          grep -aE '^\s*--- FAIL|^FAIL|^panic:|_test\.go:[0-9]+:' go-test.log | head -40 | while IFS= read -r line; do
            echo "::error title=go test failure::${line}"
          done
          exit 1

      # خروجی کامل زنجیرهٔ git + go داخل AppContainer — مدرک اجرای واقعی،
      # چون مرحلهٔ بالا بدون -v فقط شکست‌ها را چاپ می‌کند.
      - name: Sandbox NUL + git+go proof (verbose)
        shell: bash
        env:
          KODYAR_EXPECT_NUL_GRANTED: "1"
        run: |
          go test -race -count=1 -timeout 10m -v \
            -run 'TestSandboxNulProbeReportsRealState|TestSandboxGoWorksAfterNulGrant|TestSandboxCompositeExternalChildren' .

      # کامپایل واقعی اپ ویندوزی (WebView2 — بدون نیاز به پکیج سیستمی)
      - name: Desktop compile check (production)
        run: go build -tags production ./...

  # ---------------------------------------------------------------- لینوکس (ثانویه)
  linux:
    name: Test (ubuntu-latest, webkit2_41)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GTK / WebKit2GTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            pkg-config \
            build-essential \
            bubblewrap

      - name: Setup Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      # bwrap واقعی: اجرای سندباکس با bubblewrap نصب‌شده (نه فقط cross-compile).
      # اگر runner امکان namespace ندهد تست با پیام روشن skip می‌شود.
      - name: Linux sandbox exec test (real bwrap)
        run: go test -count=1 -v -run 'TestLinuxSandbox' .

      # کامپایل واقعی فرانت‌اند دسکتاپ (GTK/WebKit با cgo) — تگ production
      # است که فرانت‌اند دسکتاپ را وارد کامپایل می‌کند و webkit2_41 پکیج
      # ۴.۱ اوبونتو ۲۴.۰۴ را انتخاب می‌کند (بدون این تگ‌ها cgo اجرا نمی‌شود).
      - name: Desktop compile check (production, webkit2_41)
        run: go build -tags "production webkit2_41" ./...

  # ------------------------------------------------ تست مرورگری (اختیاری، غیربلاک‌کننده)
  # بند D.2.2 مأموریت ۳ — تست دود UI با Playwright در حالت Mock:
  # مودال دسترسی، مودال Diff، کارت خلاصه‌ی نوبت و مودال پیش‌نمایش نقطه‌ی
  # بازگشت باید واقعاً «قابل‌مشاهده» و «قابل‌کلیک» باشند. شکست این job
  # release را بلاک نمی‌کند (continue-on-error) ولی باید جدی گرفته شود؛
  # چکِ معادلِ همیشه‌روان در Go داخل خود تست‌هاست (uicontract_test.go).
  browser-smoke:
    name: Browser smoke (frontend, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend/tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run browser smoke tests
        run: npm test

  # ----------------------------------------------------------------govulncheck
  # آسیب‌پذیری‌های شناخته‌شدهٔ وابستگی‌ها (crypto، proxy، HTTP) و کد خودمان.
  # فقط مسیرهای واقعاً فراخوانی‌شده را گزارش می‌کند، پس نویز کمی دارد.
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: Install govulncheck (pinned)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  # ---------------------------------------------------------------- بیلد ویندوز (اختیاری)
  windows-build:
    name: Wails build (windows/amd64)
    runs-on: ubuntu-latest
    continue-on-error: true # build-only؛ کیفیت کد در دو job بالایی تضمین می‌شود
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: Install Wails CLI (pinned to go.mod version)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      # همان اسکریپت مستند: resource نسخه (Properties ویندوز) + wails build.
      - name: Build package (windows/amd64)
        run: bash build.sh "$(cat VERSION)"

      # exe باید مانیفست رندرشده (dpiAware) و FileVersion درست داشته باشد؛
      # بدون این چک، بیلد سبز می‌شد ولی باینری منتشرشده ناقص بود (1.0.2/1.0.3).
      - name: Verify executable manifest and FileVersion
        run: |
          export KODYAR_EXE=build/bin/KodYar.exe
          export KODYAR_EXPECTED_VERSION="$(cat VERSION)"
          go test -count=1 -run TestWindowsExecutableManifestAndVersion .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KodYar-windows-amd64
          path: build/bin/KodYar.exe
          if-no-files-found: error
